<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShareU - File Transfer</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<style>
    :root {
        --primary-color: #3498db;
        --primary-dark: #2980b9;
        --accent-color: #2ecc71;
        --danger-color: #e74c3c;
        --dark-color: #2c3e50;
        --light-color: #ecf0f1;
        --gray-color: #95a5a6;
        --border-radius: 8px;
        --box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        --transition: all 0.3s ease;
    }

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
        background-color: #f5f7fa;
        color: var(--dark-color);
        line-height: 1.6;
    }

    .app-container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 20px;
    }

    /* Header Styles */
    header {
        text-align: center;
        margin-bottom: 30px;
        padding: 20px 0;
    }

    .logo {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        margin-bottom: 5px;
    }

        .logo i {
            font-size: 2.5rem;
            color: var(--primary-color);
        }

    h1 {
        font-size: 2.5rem;
        color: var(--dark-color);
        font-weight: 700;
    }

    .tagline {
        color: var(--gray-color);
        font-size: 1.1rem;
    }

    /* Main Content */
    main {
        display: grid;
        gap: 30px;
        margin-bottom: 40px;
    }

    @media (min-width: 768px) {
        main {
            grid-template-columns: 1fr 1fr;
        }
    }

    /* Card Styles */
    .card {
        background-color: white;
        border-radius: var(--border-radius);
        box-shadow: var(--box-shadow);
        padding: 25px;
        height: 100%;
    }

    h2 {
        font-size: 1.5rem;
        margin-bottom: 20px;
        display: flex;
        align-items: center;
        gap: 10px;
        color: var(--dark-color);
    }

        h2 i {
            color: var(--primary-color);
        }

    /* Upload Section */
    .file-input-container {
        margin-bottom: 20px;
        position: relative;
    }

    .file-input {
        position: absolute;
        left: -9999px;
    }

    .file-label {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        border: 2px dashed var(--primary-color);
        border-radius: var(--border-radius);
        padding: 30px;
        cursor: pointer;
        transition: var(--transition);
        background-color: rgba(52, 152, 219, 0.05);
    }

        .file-label:hover {
            background-color: rgba(52, 152, 219, 0.1);
        }

        .file-label i {
            font-size: 2.5rem;
            color: var(--primary-color);
            margin-bottom: 10px;
        }

    .file-info {
        margin-top: 15px;
        padding: 10px;
        border-radius: var(--border-radius);
        background-color: rgba(52, 152, 219, 0.1);
        display: none;
    }

        .file-info.active {
            display: block;
        }

    /* Button Styles */
    .btn {
        padding: 12px 20px;
        border: none;
        border-radius: var(--border-radius);
        cursor: pointer;
        font-size: 1rem;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        transition: var(--transition);
        font-weight: 600;
    }

    .btn-primary {
        background-color: var(--primary-color);
        color: white;
        width: 100%;
    }

        .btn-primary:hover {
            background-color: var(--primary-dark);
        }

    .btn-download {
        background-color: var(--accent-color);
        color: white;
        padding: 8px 15px;
        font-size: 0.9rem;
    }

        .btn-download:hover {
            background-color: #27ae60;
        }

    /* File List */
    .file-list {
        min-height: 200px;
    }

    .loading {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        color: var(--gray-color);
        height: 200px;
    }

    table {
        width: 100%;
        border-collapse: collapse;
    }

    th {
        text-align: left;
        padding: 12px 15px;
        background-color: rgba(52, 152, 219, 0.1);
        color: var(--dark-color);
        font-weight: 600;
    }

    td {
        padding: 12px 15px;
        border-bottom: 1px solid #eee;
    }

    tr:hover {
        background-color: rgba(52, 152, 219, 0.05);
    }

    @media (max-width: 767px) {
        table, thead, tbody, th, td, tr {
            display: block;
        }

            thead tr {
                position: absolute;
                top: -9999px;
                left: -9999px;
            }

        tr {
            border: 1px solid #eee;
            margin-bottom: 15px;
            border-radius: var(--border-radius);
        }

        td {
            border: none;
            border-bottom: 1px solid #eee;
            position: relative;
            padding-left: 50%;
        }

            td:before {
                position: absolute;
                top: 12px;
                left: 15px;
                width: 45%;
                padding-right: 10px;
                font-weight: bold;
                content: attr(data-label);
            }

            td:last-child {
                border-bottom: none;
                text-align: center;
                padding-left: 15px;
            }
    }

    /* No Files Message */
    .no-files {
        text-align: center;
        padding: 40px 0;
        color: var(--gray-color);
    }

        .no-files i {
            font-size: 3rem;
            margin-bottom: 15px;
            opacity: 0.5;
        }

    /* Toast Notification */
    .toast {
        position: fixed;
        bottom: 20px;
        right: 20px;
        background-color: var(--accent-color);
        color: white;
        padding: 15px 25px;
        border-radius: var(--border-radius);
        box-shadow: var(--box-shadow);
        transform: translateY(100px);
        opacity: 0;
        transition: all 0.3s ease;
        z-index: 1000;
        display: flex;
        align-items: center;
        gap: 10px;
    }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        .toast.error {
            background-color: var(--danger-color);
        }

    /* Footer */
    footer {
        text-align: center;
        padding: 20px 0;
        color: var(--gray-color);
        font-size: 0.9rem;
    }

    /* Responsive adjustments */
    @media (max-width: 480px) {
        .card {
            padding: 15px;
        }

        h1 {
            font-size: 2rem;
        }

        h2 {
            font-size: 1.3rem;
        }
    }

</style>
<body>
    <div class="app-container">
        <header>
            <div class="logo">
                <i class="fas fa-share-nodes"></i>
                <h1>ShareU</h1>
            </div>
            <p class="tagline">Quick and easy file transfers</p>
        </header>

        <main>
            <section class="upload-section">
                <div class="card">
                    <h2><i class="fas fa-upload"></i> Upload Files</h2>
                    <form id="uploadForm" enctype="multipart/form-data">
                        <div class="file-input-container">
                            <input type="file" name="file" id="fileInput" class="file-input" required>
                            <label for="fileInput" class="file-label">
                                <i class="fas fa-file-arrow-up"></i>
                                <span>Choose a file</span>
                            </label>
                            <div id="fileInfo" class="file-info"></div>
                        </div>
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-cloud-upload-alt"></i> Upload
                        </button>
                    </form>
                </div>
            </section>

            <section class="files-section">
                <div class="card">
                    <h2><i class="fas fa-folder-open"></i> Available Files</h2>
                    <div id="fileList" class="file-list">
                        {fileListHtml}
                        <div class="loading">
                            <i class="fas fa-spinner fa-spin"></i> Loading files...
                        </div>
                    </div>
                </div>
            </section>
        </main>

        <footer>
            <p>&copy; 2025 ShareU - Simple File Sharing</p>
        </footer>
    </div>

    <div id="toast" class="toast"></div>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const fileInput = document.getElementById('fileInput');
            const fileInfo = document.getElementById('fileInfo');
            const uploadForm = document.getElementById('uploadForm');
            const fileList = document.getElementById('fileList');
            const toast = document.getElementById('toast');

            // Load files on page load
            loadFileList();

            // Handle file selection
            fileInput.addEventListener('change', () => {
                if (fileInput.files.length > 0) {
                    const file = fileInput.files[0];
                    const fileSize = formatFileSize(file.size);

                    fileInfo.innerHTML = `
                <div>
                    <strong>${file.name}</strong>
                    <div>Size: ${fileSize}</div>
                </div>
            `;
                    fileInfo.classList.add('active');
                } else {
                    fileInfo.classList.remove('active');
                }
            });

            // Handle form submission
            uploadForm.addEventListener('submit', async (e) => {
                e.preventDefault();

                if (!fileInput.files.length) {
                    showToast('Please select a file first', true);
                    return;
                }

                const formData = new FormData(uploadForm);

                try {
                    const response = await fetch('/upload', {
                        method: 'POST',
                        body: formData
                    });

                    const result = await response.json();

                    if (result.success) {
                        showToast(`File ${result.fileName} uploaded successfully`);
                        uploadForm.reset();
                        fileInfo.classList.remove('active');
                        loadFileList();
                    } else {
                        showToast(`Upload failed: ${result.error}`, true);
                    }
                } catch (error) {
                    showToast(`Error: ${error.message}`, true);
                }
            });

            // Function to load file list
            async function loadFileList() {
                try {
                    const response = await fetch('/?partial=true');
                    const html = await response.text();

                    if (html.trim() === '<p>No files available for download.</p>') {
                        fileList.innerHTML = `
                    <div class="no-files">
                        <i class="fas fa-folder-open"></i>
                        <p>No files available for download</p>
                    </div>
                `;
                    } else {
                        // Transform the response to make it mobile-friendly
                        let transformedHtml = html;

                        if (html.includes('<table>')) {
                            const tempDiv = document.createElement('div');
                            tempDiv.innerHTML = html;
                            const table = tempDiv.querySelector('table');

                            // Get headers
                            const headers = [];
                            const headerCells = table.querySelectorAll('th');
                            headerCells.forEach(cell => {
                                headers.push(cell.textContent);
                            });

                            // Update each cell with data-label for mobile view
                            const rows = table.querySelectorAll('tbody tr');
                            rows.forEach(row => {
                                const cells = row.querySelectorAll('td');
                                cells.forEach((cell, index) => {
                                    if (index < headers.length) {
                                        cell.setAttribute('data-label', headers[index]);
                                    }
                                });
                            });

                            transformedHtml = tempDiv.innerHTML;
                        }

                        fileList.innerHTML = transformedHtml;
                    }

                    // Add event listeners to download buttons
                    const downloadButtons = fileList.querySelectorAll('a.button');
                    downloadButtons.forEach(button => {
                        button.classList.remove('button');
                        button.classList.add('btn', 'btn-download');
                        button.innerHTML = `<i class="fas fa-download"></i> Download`;
                    });

                } catch (error) {
                    fileList.innerHTML = `
                <div class="no-files">
                    <i class="fas fa-exclamation-triangle"></i>
                    <p>Error loading files: ${error.message}</p>
                </div>
            `;
                }
            }

            // Helper function to show toast messages
            function showToast(message, isError = false) {
                toast.textContent = message;
                toast.className = 'toast';

                if (isError) {
                    toast.classList.add('error');
                }

                toast.classList.add('show');

                setTimeout(() => {
                    toast.classList.remove('show');
                }, 3000);
            }

            // Helper function to format file size
            function formatFileSize(bytes) {
                if (bytes === 0) return '0 Bytes';

                const k = 1024;
                const sizes = ['Bytes', 'KB', 'MB', 'GB', 'TB'];
                const i = Math.floor(Math.log(bytes) / Math.log(k));

                return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
            }
        });
    </script>
</body>
</html>
